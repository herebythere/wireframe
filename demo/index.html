<!DOCTYPE html>
<html>

<head>
	<link href="../dist/wireframe.css" rel="stylesheet">
	<link href="../stylesheets/themes/wireframe.css" rel="stylesheet">
	<link href="./styles/demo.css" rel="stylesheet">

	<script type="module" src="./scripts/components.js"></script>
</head>

<body>
	<header data-grid-name="hd">
		<h1>Wireframe</h1>
	</header>
	<main>
		<section data-grid-name="ls">
			<h1>Css Components</h1>
			<ul>
				<li>
					Button
				</li>
				<li>
					Checkbox
				</li>
				<li>
					Radio
				</li>
				<li>
					Switch

				</li>
				<li>
					Range
				</li>
				<li>
					Progress
				</li>
				<li>
					Text inputs
				</li>
				<li>
					Digit inputs
				</li>
				<li>
					Textarea
				</li>
				<li>
					Color swatch
				</li>
			</ul>	
			<h1>Web Components</h1>
			<ul>
				<li>Toolbar</li>
			</ul>
		</section>
		<section data-grid-name="cpmt">
			<h1>Button</h1>
			<p>A <code>button</code> correlates a tap or press to an action in softare.</p>
			<section>
				<button>button</button>
				<button data-wf="primary-button" data-wf-variant="primary">primary</button>
				<button data-wf="destructive-button" data-wf-variant="destructive">destructive</button>
				<button data-wf="icon-button" data-wf-variant="icon">1</button>
				<button data-wf="primary-icon-button">2</button>
				<button data-wf="destructive-icon-button">&#xD7</button>
			</section>
		</section>
	</main>
	<footer data-grid-name="ftr">
		Hello a footer!
	</footer>
</body>

</html>
